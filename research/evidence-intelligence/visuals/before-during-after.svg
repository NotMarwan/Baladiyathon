  <text x="1520" y="143" fill="#A8BACB" font-size="22" font-weight="400" text-anchor="end">التوقيت الفعلي ومقارنة الأيام جزء من الدليل، وليسا تفاصيل إدارية</text>
  <line x1="160" y1="480" x2="1440" y2="480" stroke="#27435C" stroke-width="10" stroke-linecap="round"/><rect x="170" y="410" width="315" height="140" rx="22" fill="#4AA8FF" stroke="none" stroke-width="0"/><text x="457" y="456" fill="#08131F" font-size="32" font-weight="800" text-anchor="end">قبل</text><text x="457" y="493" fill="#08131F" font-size="21" font-weight="600" text-anchor="end">أسبوعان</text><text x="457" y="525" fill="#08131F" font-size="18" font-weight="450" text-anchor="end">خط أساس وأيام مماثلة</text><rect x="650" y="410" width="300" height="140" rx="22" fill="#FFB454" stroke="none" stroke-width="0"/><text x="922" y="456" fill="#08131F" font-size="32" font-weight="800" text-anchor="end">أثناء</text><text x="922" y="493" fill="#08131F" font-size="21" font-weight="600" text-anchor="end">الإغلاق الفعلي كاملاً</text><text x="922" y="525" fill="#08131F" font-size="18" font-weight="450" text-anchor="end">كل مرحلة منفصلة</text><rect x="1080" y="410" width="315" height="140" rx="22" fill="#51D88A" stroke="none" stroke-width="0"/><text x="1367" y="456" fill="#08131F" font-size="32" font-weight="800" text-anchor="end">بعد</text><text x="1367" y="493" fill="#08131F" font-size="21" font-weight="600" text-anchor="end">أسبوع على الأقل</text><text x="1367" y="525" fill="#08131F" font-size="18" font-weight="450" text-anchor="end">الاستشفاء والعودة</text><rect x="170" y="620" width="1225" height="92" rx="18" fill="#102235" stroke="none" stroke-width="0"/><text x="1360" y="655" fill="#F5F7FA" font-size="25" font-weight="650" text-anchor="end">طريق المقارنة يعمل طوال الفترات الثلاث</text><text x="1360" y="690" fill="#A8BACB" font-size="20" font-weight="400" text-anchor="end">يُختار قبل رؤية النتيجة ويُفحص تشابه نمطه قبل العمل</text><path d="M250 620 L250 575 M760 620 L760 575 M1250 620 L1250 575" stroke="#31D7D0" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1520" y="868" fill="#A8BACB" font-size="18" font-weight="400" text-anchor="end">منظومة استخبارات الأدلة — 26 يوليو 2026</text>
