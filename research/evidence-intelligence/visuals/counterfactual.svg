  <rect x="70" y="58" width="12" height="92" rx="6" fill="#31D7D0" stroke="none" stroke-width="0"/>
  <text x="1520" y="100" fill="#F5F7FA" font-size="42" font-weight="700" text-anchor="end">لماذا نحتاج طريق مقارنة؟</text>
  <text x="1520" y="143" fill="#A8BACB" font-size="22" font-weight="400" text-anchor="end">المدينة قد تتغير في اليوم نفسه؛ الفرق وحده يخلط أثر العمل مع الاتجاه العام</text>
  <rect x="120" y="235" width="600" height="250" rx="24" fill="#102235" stroke="none" stroke-width="0"/><text x="680" y="285" fill="#FFB454" font-size="30" font-weight="750" text-anchor="end">الطريق المتأثر</text><text x="680" y="340" fill="#F5F7FA" font-size="24" font-weight="500" text-anchor="end">قبل: ١٠ دقائق</text><text x="680" y="390" fill="#F5F7FA" font-size="24" font-weight="500" text-anchor="end">أثناء: ١٦ دقيقة</text><text x="680" y="445" fill="#FFB454" font-size="28" font-weight="750" text-anchor="end">التغير: +٦ دقائق</text><rect x="880" y="235" width="600" height="250" rx="24" fill="#102235" stroke="none" stroke-width="0"/><text x="1440" y="285" fill="#31D7D0" font-size="30" font-weight="750" text-anchor="end">طريق المقارنة</text><text x="1440" y="340" fill="#F5F7FA" font-size="24" font-weight="500" text-anchor="end">قبل: ١٠ دقائق</text><text x="1440" y="390" fill="#F5F7FA" font-size="24" font-weight="500" text-anchor="end">أثناء: ١٢ دقيقة</text><text x="1440" y="445" fill="#31D7D0" font-size="28" font-weight="750" text-anchor="end">التغير: +٢ دقيقة</text><path d="M720 360 C790 360 810 360 880 360" stroke="#A8BACB" stroke-width="4" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A8BACB"/></marker></defs><rect x="320" y="585" width="960" height="120" rx="24" fill="#153049" stroke="#31D7D0" stroke-width="2"/><text x="1230" y="635" fill="#F5F7FA" font-size="30" font-weight="750" text-anchor="end">أثر العمل = تغير المتأثر − تغير المقارنة</text><text x="1230" y="680" fill="#51D88A" font-size="27" font-weight="750" text-anchor="end">٤ دقائق في المثال، لا ٦ دقائق</text>
  <text x="1520" y="868" fill="#A8BACB" font-size="18" font-weight="400" text-anchor="end">منظومة استخبارات الأدلة — 26 يوليو 2026</text>
</svg>
