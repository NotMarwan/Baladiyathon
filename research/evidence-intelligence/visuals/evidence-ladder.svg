<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#08131F"/>
  <style>
    text { font-family: Tahoma, "Segoe UI", Arial, sans-serif; }
  </style>
  <rect x="70" y="58" width="12" height="92" rx="6" fill="#31D7D0" stroke="none" stroke-width="0"/>
  <text x="1520" y="100" fill="#F5F7FA" font-size="42" font-weight="700" text-anchor="end">سلّم الأدلة</text>
  <text x="1520" y="143" fill="#A8BACB" font-size="22" font-weight="400" text-anchor="end">قوة الدليل تأتي من القرب من الحالة وجودة القياس، لا من كثرة المصادر</text>
  <rect x="110" y="195" width="1380" height="78" rx="18" fill="#102235" stroke="none" stroke-width="0"/><circle cx="1438" cy="234" r="27" fill="#51D88A"/><text x="1438" y="243" fill="#08131F" font-size="28" font-weight="800" text-anchor="middle">A</text><text x="1375" y="230" fill="#F5F7FA" font-size="28" font-weight="650" text-anchor="end">دليل ميداني محلي مباشر</text><text x="1375" y="258" fill="#A8BACB" font-size="19" font-weight="400" text-anchor="end">أثر الحالة نفسها</text><text x="150" y="244" fill="#51D88A" font-size="18" font-weight="600" text-anchor="start">أعلى صلاحية للأثر</text><rect x="110" y="296" width="1380" height="78" rx="18" fill="#153049" stroke="none" stroke-width="0"/><circle cx="1438" cy="335" r="27" fill="#31D7D0"/><text x="1438" y="344" fill="#08131F" font-size="28" font-weight="800" text-anchor="middle">B</text><text x="1375" y="331" fill="#F5F7FA" font-size="28" font-weight="650" text-anchor="end">رصد محلي لنفس المسار</text><text x="1375" y="359" fill="#A8BACB" font-size="19" font-weight="400" text-anchor="end">خط أساس فقط</text><text x="150" y="345" fill="#31D7D0" font-size="18" font-weight="600" text-anchor="start"></text><rect x="110" y="397" width="1380" height="78" rx="18" fill="#102235" stroke="none" stroke-width="0"/><circle cx="1438" cy="436" r="27" fill="#4AA8FF"/><text x="1438" y="445" fill="#08131F" font-size="28" font-weight="800" text-anchor="middle">C</text><text x="1375" y="432" fill="#F5F7FA" font-size="28" font-weight="650" text-anchor="end">حالة سعودية مشابهة</text><text x="1375" y="460" fill="#A8BACB" font-size="19" font-weight="400" text-anchor="end">فرضية محلية</text><text x="150" y="446" fill="#4AA8FF" font-size="18" font-weight="600" text-anchor="start"></text><rect x="110" y="498" width="1380" height="78" rx="18" fill="#153049" stroke="none" stroke-width="0"/><circle cx="1438" cy="537" r="27" fill="#FFB454"/><text x="1438" y="546" fill="#08131F" font-size="28" font-weight="800" text-anchor="middle">D</text><text x="1375" y="533" fill="#F5F7FA" font-size="28" font-weight="650" text-anchor="end">حالة عالمية مشابهة</text><text x="1375" y="561" fill="#A8BACB" font-size="19" font-weight="400" text-anchor="end">تشبيه وتصميم</text><text x="150" y="547" fill="#FFB454" font-size="18" font-weight="600" text-anchor="start"></text><rect x="110" y="599" width="1380" height="78" rx="18" fill="#102235" stroke="none" stroke-width="0"/><circle cx="1438" cy="638" r="27" fill="#B58BFF"/><text x="1438" y="647" fill="#08131F" font-size="28" font-weight="800" text-anchor="middle">E</text><text x="1375" y="634" fill="#F5F7FA" font-size="28" font-weight="650" text-anchor="end">نموذج أو محاكاة</text><text x="1375" y="662" fill="#A8BACB" font-size="19" font-weight="400" text-anchor="end">سيناريو لا مشاهدة</text><text x="150" y="648" fill="#B58BFF" font-size="18" font-weight="600" text-anchor="start"></text><rect x="110" y="700" width="1380" height="78" rx="18" fill="#153049" stroke="none" stroke-width="0"/><circle cx="1438" cy="739" r="27" fill="#718096"/><text x="1438" y="748" fill="#08131F" font-size="28" font-weight="800" text-anchor="middle">F</text><text x="1375" y="735" fill="#F5F7FA" font-size="28" font-weight="650" text-anchor="end">بيانات تركيبية</text><text x="1375" y="763" fill="#A8BACB" font-size="19" font-weight="400" text-anchor="end">اختبار المنطق فقط</text><text x="150" y="749" fill="#718096" font-size="18" font-weight="600" text-anchor="start">لا يدخل ادعاء أثر</text>
  <text x="1520" y="868" fill="#A8BACB" font-size="18" font-weight="400" text-anchor="end">منظومة استخبارات الأدلة — 26 يوليو 2026</text>
</svg>
