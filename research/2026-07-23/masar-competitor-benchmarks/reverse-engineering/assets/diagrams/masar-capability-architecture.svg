<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15202B" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8A929B"/>
    </marker>
    <style>
      .arabic { font-family: "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif; direction: rtl; unicode-bidi: plaintext; }
      .title { font-size: 42px; font-weight: 800; fill: #15202B; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #5A6672; }
      .heading { font-size: 23px; font-weight: 800; fill: #15202B; }
      .label { font-size: 18px; font-weight: 700; fill: #15202B; }
      .small { font-size: 15px; font-weight: 500; fill: #5A6672; }
      .owned { fill: #E9F1F7; stroke: #1D4E77; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .integrated { fill: #E4F1EA; stroke: #2F7A57; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .specialist { fill: #F4EDE1; stroke: #A9722B; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .public { fill: #FFFFFF; stroke: #D8DEE4; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .line { fill: none; stroke: #8A929B; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ECEFF2"/>
  <text class="arabic title" x="1500" y="80" text-anchor="end">معمار القدرات: ما يملكه أثر وما يتكامل معه</text>
  <text class="arabic subtitle" x="1500" y="118" text-anchor="end">الهدف منع إعادة بناء التصاريح والملاحة والمحاكاة والأجهزة داخل منتج واحد</text>

  <text class="arabic heading" x="1470" y="190" text-anchor="end">الواجهات</text>
  <rect class="public" x="1040" y="215" width="430" height="120"/>
  <text class="arabic label" x="1255" y="260" text-anchor="middle">مكتب المراجع</text>
  <text class="arabic small" x="1255" y="292" text-anchor="middle">صندوق الأعمال • الخريطة • ملف القرار</text>

  <rect class="public" x="585" y="215" width="390" height="120"/>
  <text class="arabic label" x="780" y="260" text-anchor="middle">واجهة الميدان</text>
  <text class="arabic small" x="780" y="292" text-anchor="middle">مهام • بدء وإيقاف • قياس • صور</text>

  <rect class="public" x="130" y="215" width="390" height="120"/>
  <text class="arabic label" x="325" y="260" text-anchor="middle">الخريطة العامة</text>
  <text class="arabic small" x="325" y="292" text-anchor="middle">بحث • وصف مبسط • تحويلة • حداثة</text>

  <path class="line" d="M1255 335 V405"/>
  <path class="line" d="M780 335 V405"/>
  <path class="line" d="M325 335 V405"/>

  <text class="arabic heading" x="1470" y="415" text-anchor="end">قلب أثر</text>
  <rect class="owned" x="1040" y="440" width="430" height="170"/>
  <text class="arabic label" x="1255" y="485" text-anchor="middle">محرك القرار</text>
  <text class="arabic small" x="1255" y="522" text-anchor="middle">الأثر • البدائل • التفسير • الثقة</text>
  <text class="arabic small" x="1255" y="554" text-anchor="middle">ميزانية المحور • قواعد التصعيد</text>

  <rect class="owned" x="585" y="440" width="390" height="170"/>
  <text class="arabic label" x="780" y="485" text-anchor="middle">التنسيق والخطة</text>
  <text class="arabic small" x="780" y="522" text-anchor="middle">التعارض • الحفر المشترك • الخطة</text>
  <text class="arabic small" x="780" y="554" text-anchor="middle">الحالات • النسخ • سجل التدقيق</text>

  <rect class="owned" x="130" y="440" width="390" height="170"/>
  <text class="arabic label" x="325" y="485" text-anchor="middle">النشر والتعلم</text>
  <text class="arabic small" x="325" y="522" text-anchor="middle">التحقق • القنوات • المراقبة</text>
  <text class="arabic small" x="325" y="554" text-anchor="middle">المتوقع مقابل المرصود • المعايرة</text>

  <path class="line" d="M1040 525 H975"/>
  <path class="line" d="M585 525 H520"/>

  <text class="arabic heading" x="1470" y="690" text-anchor="end">التكاملات</text>
  <rect class="integrated" x="1150" y="715" width="320" height="120"/>
  <text class="arabic label" x="1310" y="758" text-anchor="middle">التصاريح الوطنية</text>
  <text class="arabic small" x="1310" y="790" text-anchor="middle">الهوية • الطلب • الحالة • القرار</text>

  <rect class="integrated" x="800" y="715" width="300" height="120"/>
  <text class="arabic label" x="950" y="758" text-anchor="middle">الحركة والتوجيه</text>
  <text class="arabic small" x="950" y="790" text-anchor="middle">سرعات • طلب • مسارات</text>

  <rect class="integrated" x="450" y="715" width="300" height="120"/>
  <text class="arabic label" x="600" y="758" text-anchor="middle">النشر والخرائط</text>
  <text class="arabic small" x="600" y="790" text-anchor="middle">سجل معياري • إقرار • انتهاء</text>

  <rect class="integrated" x="130" y="715" width="270" height="120"/>
  <text class="arabic label" x="265" y="758" text-anchor="middle">الميدان والبيانات</text>
  <text class="arabic small" x="265" y="790" text-anchor="middle">أجهزة • مرافق • نقل عام</text>

  <rect class="specialist" x="535" y="875" width="530" height="80"/>
  <text class="arabic label" x="800" y="910" text-anchor="middle">محاكاة متخصصة للحالات العالية فقط</text>
  <text class="arabic small" x="800" y="938" text-anchor="middle">تستقبل حزمة سيناريو وتعيد مؤشرات قابلة للمقارنة</text>

  <path class="line" d="M1255 610 V680 H1310 V715"/>
  <path class="line" d="M1110 610 V680 H950 V715"/>
  <path class="line" d="M780 610 V680 H600 V715"/>
  <path class="line" d="M325 610 V715"/>
  <path class="line" d="M950 835 V875"/>

  <circle cx="104" cy="905" r="9" fill="#1D4E77"/>
  <text class="arabic small" x="125" y="911">قدرة يملكها أثر</text>
  <circle cx="104" cy="935" r="9" fill="#2F7A57"/>
  <text class="arabic small" x="125" y="941">قدرة متكاملة</text>
</svg>
