<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15202B" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8A929B"/>
    </marker>
    <style>
      .arabic { font-family: "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif; direction: rtl; unicode-bidi: plaintext; }
      .title { font-size: 42px; font-weight: 800; fill: #15202B; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #5A6672; }
      .stage { font-size: 18px; font-weight: 800; fill: #1D4E77; }
      .label { font-size: 20px; font-weight: 700; fill: #15202B; }
      .small { font-size: 15px; font-weight: 500; fill: #5A6672; }
      .step { fill: #FFFFFF; stroke: #D8DEE4; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .decision { fill: #F4EDE1; stroke: #A9722B; stroke-width: 2; filter: url(#shadow); }
      .success { fill: #E4F1EA; stroke: #2F7A57; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .danger { fill: #F7E4E1; stroke: #B23B32; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .line { fill: none; stroke: #8A929B; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #8A929B; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#ECEFF2"/>
  <text class="arabic title" x="1500" y="80" text-anchor="end">رحلة المراجع المقترحة في أثر</text>
  <text class="arabic subtitle" x="1500" y="118" text-anchor="end">تركيب نظيف من أفضل أنماط المنافسين مع بقاء القرار والتفسير داخل أثر</text>

  <text class="arabic stage" x="1450" y="185" text-anchor="end">الفرز</text>
  <rect class="step" x="1120" y="210" width="360" height="110"/>
  <text class="arabic label" x="1300" y="255" text-anchor="middle">فتح صندوق الأعمال</text>
  <text class="arabic small" x="1300" y="288" text-anchor="middle">عالي الأثر • متعارض • ناقص • جاهز</text>

  <path class="line" d="M1120 265 H1010"/>
  <rect class="step" x="650" y="210" width="360" height="110"/>
  <text class="arabic label" x="830" y="255" text-anchor="middle">اختيار العمل</text>
  <text class="arabic small" x="830" y="288" text-anchor="middle">تركيز الخريطة وفتح ملف القرار</text>

  <path class="line" d="M650 265 H540"/>
  <polygon class="decision" points="380,195 540,265 380,335 220,265"/>
  <text class="arabic label" x="380" y="255" text-anchor="middle">هل البيانات مكتملة؟</text>
  <text class="arabic small" x="380" y="285" text-anchor="middle">المصدر • الحداثة • الثقة</text>

  <text class="arabic stage" x="1450" y="410" text-anchor="end">التحليل</text>
  <path class="line" d="M380 335 V400 H540"/>
  <rect class="step" x="540" y="365" width="360" height="110"/>
  <text class="arabic label" x="720" y="410" text-anchor="middle">حساب الأثر والتعارض</text>
  <text class="arabic small" x="720" y="443" text-anchor="middle">الزمن • الأشخاص • الطابور • المحفظة</text>

  <path class="line" d="M540 420 H430"/>
  <polygon class="decision" points="270,350 430,420 270,490 110,420"/>
  <text class="arabic label" x="270" y="410" text-anchor="middle">هل الحالة عالية؟</text>
  <text class="arabic small" x="270" y="440" text-anchor="middle">أثر مرتفع أو ثقة منخفضة</text>

  <path class="line" d="M110 420 H60 V560 H280"/>
  <rect class="danger" x="280" y="510" width="360" height="110"/>
  <text class="arabic label" x="460" y="555" text-anchor="middle">محاكاة أو مراجعة متخصصة</text>
  <text class="arabic small" x="460" y="588" text-anchor="middle">تعود المؤشرات ولا تنتقل ملكية القرار</text>

  <path class="line" d="M640 565 H760"/>
  <rect class="step" x="760" y="510" width="360" height="110"/>
  <text class="arabic label" x="940" y="555" text-anchor="middle">ترتيب ثلاثة بدائل</text>
  <text class="arabic small" x="940" y="588" text-anchor="middle">الطلب الأصلي • نافذة محسنة • مراحل</text>
  <path class="dash" d="M270 490 V565 H760"/>

  <text class="arabic stage" x="1450" y="705" text-anchor="end">القرار</text>
  <path class="line" d="M940 620 V690 H1120"/>
  <rect class="step" x="1120" y="645" width="360" height="110"/>
  <text class="arabic label" x="1300" y="690" text-anchor="middle">مراجعة الأسباب والقيود</text>
  <text class="arabic small" x="1300" y="723" text-anchor="middle">الفرق الرقمي • المصدر • حدود الثقة</text>

  <path class="line" d="M1120 700 H1010"/>
  <rect class="step" x="650" y="645" width="360" height="110"/>
  <text class="arabic label" x="830" y="690" text-anchor="middle">تحرير مسودة خطة المرور</text>
  <text class="arabic small" x="830" y="723" text-anchor="middle">المسار • العلامات • المراحل • الطباعة</text>

  <path class="line" d="M650 700 H540"/>
  <polygon class="decision" points="380,630 540,700 380,770 220,700"/>
  <text class="arabic label" x="380" y="690" text-anchor="middle">قرار المراجع</text>
  <text class="arabic small" x="380" y="720" text-anchor="middle">اعتماد • إرجاع • رفض</text>

  <text class="arabic stage" x="1450" y="875" text-anchor="end">التنفيذ والتعلم</text>
  <path class="line" d="M380 770 V840 H560"/>
  <rect class="success" x="560" y="800" width="310" height="110"/>
  <text class="arabic label" x="715" y="845" text-anchor="middle">النشر والمراقبة</text>
  <text class="arabic small" x="715" y="878" text-anchor="middle">إقرار القناة • حالة ميدانية • تنبيه</text>

  <path class="line" d="M870 855 H980"/>
  <rect class="success" x="980" y="800" width="360" height="110"/>
  <text class="arabic label" x="1160" y="845" text-anchor="middle">المقارنة والمعايرة</text>
  <text class="arabic small" x="1160" y="878" text-anchor="middle">المتوقع مقابل المرصود ثم تحديث الذاكرة</text>

  <path class="dash" d="M220 700 H90 V265 H220"/>
  <text class="arabic small" x="115" y="610" text-anchor="middle" transform="rotate(-90 115 610)">إرجاع الطلب أو تعديل الخطة</text>

  <rect x="70" y="970" width="1460" height="2" fill="#D8DEE4"/>
  <text class="arabic small" x="1500" y="1010" text-anchor="end">المبدأ: لا قرار بلا نسخة مدخلات، ولا نشر بلا صلاحية زمنية، ولا معايرة بلا جودة مصدر</text>
</svg>
