<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسار — الخريطة</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="masar-worksmap-page.css">
</head>
<body>

<header class="wm-bar">
  <h1>أعمال الطرق في الرياض — الخريطة العامة للسكان</h1>
  <span class="wm-badge">بيانات توضيحية للعرض</span>

  <label class="wm-search">
    <span class="visually-hidden">ابحث باسم الشارع</span>
    <input id="wmSearch" type="search" placeholder="ابحث باسم الشارع…" autocomplete="off">
  </label>

  <span class="wm-bar-spacer"></span>
  <span class="wm-updated" id="wmUpdated">آخر تحديث: —</span>
  <span class="wm-stat" id="wmStat" role="status">جارٍ التحميل…</span>
</header>

<!-- الحل قبل الخريطة لا بعدها: ما يُراد أن يُقرأ أولاً يوضع حيث تبدأ العين. -->
<div class="wm-hero" id="wmHero" role="status" aria-live="polite">
  <span class="works-bar-empty">جارٍ حساب الوفر…</span>
</div>

<main>
  <!-- منطقة موصوفة، لا دور «تطبيق»: ذاك الدور يَعِد القارئ الصوتي بأن المفاتيح
       كلها تُدار داخل العنصر فيصمت عن بنيته — وعدٌ كاذب ما دام السجل لا يبلغه
       Tab. الخريطة رسمٌ، والوصول إلى السجلات في القائمة المجاورة، والوصف يقوله. -->
  <div id="map" role="region"
       aria-label="خريطة أعمال الطرق والإغلاقات والحوادث"
       aria-describedby="wmMapNote"></div>
  <p id="wmMapNote" class="visually-hidden">
    الخريطة رسمٌ بصري. السجلات المعروضة عليها مسرودة أزراراً في قائمة «السجلات
    المعروضة»، وكل زر يفتح بطاقة السجل وينتقل إلى موقعه.
  </p>

  <!-- عمود واحد: تحكّم ثم سجلات ثم دليل. القائمة والدليل يُبنيان من سجل
       الطبقات نفسه — نصٌّ مكتوب بيده بجوار نصٍّ مولَّد ينحرفان عند أول تعديل. -->
  <div class="wm-side">
    <aside id="control-panel" aria-label="عناصر التحكم بالخريطة"></aside>

    <section class="wm-records" id="wmRecords" aria-labelledby="wmRecordsTitle">
      <h2 id="wmRecordsTitle">السجلات المعروضة <span class="wm-records-count" id="wmRecordsCount"></span></h2>
      <div class="wm-records-body" id="wmRecordsBody"></div>
    </section>

    <section class="wm-legend" id="wmLegend" aria-label="دليل الخريطة"></section>
  </div>
</main>

<script src="masar-nav.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<!--
  نظرة المباني العامة مع الصفحة لا بعد جاهزية الخريطة.
  427 كيلوبايت تصل قبل الشرايين فتُرسم كتلُ المدينة في الثانية الأولى، ثم
  تحلّ محلّها المضلعات الحقيقية بلاطةً بلاطة. تركُها لما بعد `onReady` يجعلها
  تصطف خلف حمولةٍ بستة عشر ميغابايت، فتبقى الشاشة بلا مبنى ثلاث ثوانٍ.
-->
<script src="data/buildings-overview.js"></script>
<script src="data/riyadh-roads.geojson.js"></script>
<script src="data/riyadh-base.geojson.js"></script>
<script src="data/city-portfolio.geojson.js"></script>
<script src="masar-worksmap-style.js"></script>
<script src="masar-worksmap-layers.js"></script>
<script src="masar-worksmap-data.js"></script>
<script src="masar-worksmap.js"></script>
<script src="masar-roads-lazy.js"></script>
<script src="masar-buildings-lazy.js"></script>
<script src="masar-worksmap-panel.js"></script>
<script src="masar-worksmap-solution.js"></script>
<script src="masar-city-routing.js"></script>
<script src="masar-worksmap-interactions.js"></script>
<script>
(function () {
  'use strict';

  // صفحة الخريطة مستقلة عن النموذج: تبني الخريطة مباشرة بلا عقد الممر.
  // البيانات محلية بالكامل (window globals) فتعمل من القرص كما تعمل من الخادم.
  var container = document.getElementById('map');
  var stat = document.getElementById('wmStat');

  function fail(message) {
    stat.textContent = 'تعذّر العرض';
    var box = document.createElement('p');
    box.className = 'wm-error';
    box.setAttribute('role', 'alert');
    box.textContent = message;
    document.querySelector('main').appendChild(box);
  }

  if (typeof maplibregl === 'undefined' || typeof MasarWorksMap === 'undefined') {
    fail('تعذّر تحميل محرك الخريطة.');
    return;
  }

  var GL = MasarWorksMap.init(container, window.RIYADH_ROADS, {
    baseGeoJSON: window.RIYADH_BASE,
    center: [46.6872, 24.6902],
    zoom: 11.7,
  });

  GL.map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
  GL.map.addControl(new maplibregl.ScaleControl({ maxWidth: 110, unit: 'metric' }), 'bottom-left');

  GL.api.onReady(function () {
    /*
     * الطبقات الرسمية داخل حاجز، والسجلات خارجه.
     * -----------------------------------------------------------------------
     * `onReady` تُطلق الآن من ثلاثة أبواب: إقلاعٌ سليم، وخطأ، ومهلة تنقضي.
     * وفي البابين الأخيرين لا يوجد نمطٌ محمَّل، فكل ما يضيف مصدراً أو طبقة قد
     * يرمي — والرمية في سلسلةٍ واحدة تُسقط ما بعدها، وما بعدها هو **السجلات
     * والبحث والعدّاد**: أي الصفحة كلها بالنسبة لساكنٍ يبحث عن شارعه.
     *
     * فالترتيب مقصود: كل ما يحتاج WebGL في حاجزه، وما لا يحتاجه بعده مكشوفاً.
     * القائمة تُعرض والخريطة تغيب — لا العكس.
     */
    if (GL.api.isDegraded()) {
      console.warn('[masar] الخريطة لم تُقلع: ' + GL.api.degradedReason()
        + ' — السجلات تُعرض في القائمة بلا رسم.');
    }

    try { armMapLayers(); } catch (err) {
      console.error('[masar] الطبقات الرسمية لم تُركَّب:', err);
    }

    function armMapLayers() {
    /**
     * سلسلة التأجيل، من الأخفّ فائدةً إلى الأثقل زينةً:
     *   شرايين (مع الصفحة) → محلية → رسم التوجيه → شوارع الأحياء.
     *
     * رسم التوجيه قبل شوارع الأحياء لأنه يفتح ميزةً وهي تُحسّن منظراً.
     */
    if (typeof MasarRoadsLazy !== 'undefined') {
      MasarRoadsLazy.attach(GL.api, {
        onDone: function () {
          MasarRoadsLazy.load('data/riyadh-route-graph.js', 'RIYADH_ROUTE_GRAPH',
            function (err, graph) {
              if (!err) armRouting(graph);
              MasarRoadsLazy.attach(GL.api, {
                src: 'data/riyadh-roads-neighbourhood.geojson.js',
                globalName: 'RIYADH_ROADS_HOOD',
              });
            });
        },
      });
    }

    /**
     * المباني خارج السلسلة عمداً.
     * ---------------------------------------------------------------------
     * كانت آخر حلقةٍ في تأجيلٍ رباعي، فلا تبدأ قبل أن تنتهي ثلاثُ حمولات
     * قبلها — ثم تُنزِّل المدينة كلها (101 ميغابايت) دفعةً واحدة. وقيس الأثر
     * على متصفح نظيف: عند تقريب 500 متر لا يُرسم مبنى حتى **40 ثانية**، وعند
     * 100 متر يُرسم عند **10**. فقرأها المستعمل شرطاً على النزول إلى مئة متر،
     * وليس في الشيفرة عتبةُ تكبيرٍ أصلاً.
     *
     * الآن تبدأ فوراً ومستقلّة، وتحمّل ما يخصّ الكاميرا الحالية وحده — تُقرأ
     * حالتها عند التركيب لا عند أول حركة.
     */
    if (typeof MasarBuildingsLazy !== 'undefined') {
      window.__masarBuildings = MasarBuildingsLazy.install(GL.map);
    }
    } // ← نهاية armMapLayers

    var works = window.MASAR_CITY_PORTFOLIO || { type: 'FeatureCollection', features: [] };
    GL.api.setWorks(works);

    /* التفاعلات تسجّل مستمعات على طبقاتٍ قد لا توجد. مستمعٌ على طبقة غائبة
       لا يُطلق ولا يضرّ — لكن التركيب نفسه يلمس الخريطة، فيبقى في حاجزه. */
    try {
      MasarWorksMapInteractions.install(GL.map, maplibregl, {
        decorate: function (rendered) {
          // الهندسة المرسومة مقصوصة على حدود البلاطة؛ التوجيه يحتاج الأصل.
          return detourFor(byId[rendered.properties.id] || rendered);
        },
      });
    } catch (err) {
      console.error('[masar] تفاعلات الخريطة لم تُركَّب:', err);
    }
    MasarWorksMapPanel.mount(document.getElementById('control-panel'), GL.api, Date.now());

    var Data = MasarWorksMapData;
    var groups = MasarWorksMapLayers.LAYER_GROUPS;
    var panelRoot = document.getElementById('control-panel');
    var features = GL.api.getData().works.features;
    var select = document.getElementById('masar-date-preset');
    var search = document.getElementById('wmSearch');
    var updated = document.getElementById('wmUpdated');
    var recordsBody = document.getElementById('wmRecordsBody');
    var recordsCount = document.getElementById('wmRecordsCount');
    var hero = document.getElementById('wmHero');

    document.getElementById('wmLegend').innerHTML = MasarWorksMapPanel.renderLegend(groups);

    /* ---- المسارات البديلة على شبكة الرياض ---- */

    var byId = {};
    features.forEach(function (feature) { byId[feature.properties.id] = feature; });

    var ROUTE_SOURCE = 'routes';
    var EMPTY_ROUTES = { type: 'FeatureCollection', features: [] };
    var routing = null;

    /**
     * الرسم يصل عند الخمول، والبطاقة قد تُفتح قبله.
     * فالتسليح منفصل عن الاستعمال: قبل وصوله تعمل البطاقة بلا كتلة بديل، وبعده
     * تعمل بها — ولا يُنتظر أحد.
     */
    function armRouting(graph) {
      if (typeof MasarCityRouting === 'undefined' || !graph) return;
      routing = MasarCityRouting.prepare(graph);

      if (!GL.map.getSource(ROUTE_SOURCE)) {
        GL.map.addSource(ROUTE_SOURCE, { type: 'geojson', data: EMPTY_ROUTES });
        /**
         * المسارات تحت الرموز لا فوقها.
         * ---------------------------------------------------------------------
         * `addLayer` بلا مرجع يضع الطبقة أعلى الكل، فيمرّ خطُّ بديلٍ فوق شارة
         * المنع ويغطّيها — والشارة هي ما يشرح سببَ البديل أصلاً.
         *
         * الترتيب المقصود: خريطة أساس · شوارع وأسماء · أعمال وحوادث · مقطع
         * مغلق · بدائل · رموز · نوافذ. فتُدرَج المسارات قبل أول طبقة رموز.
         */
        /**
         * المعرّف يُقرأ من سجل الطبقات لا من `getStyle()`.
         * `getStyle()` يُسلسِل المصادر بما فيها — ومصدر المباني وحده 97 ميغابايت
         * من GeoJSON مضمَّن. استدعاؤه لقراءة اسمِ طبقة يبني نسخةً من الخريطة
         * كلها في الذاكرة عند كل تسليح.
         */
        var beforeId = null;
        var groups = MasarWorksMapLayers.LAYER_GROUPS;
        for (var g = 0; g < groups.length && !beforeId; g += 1) {
          for (var c = 0; c < groups[g].configs.length; c += 1) {
            var candidate = groups[g].configs[c].name + '-symbols';
            if (GL.map.getLayer(candidate)) { beforeId = candidate; break; }
          }
        }
        MasarWorksMapSolution.buildRouteLayers(ROUTE_SOURCE).forEach(function (layer) {
          // وسم الزمن رمزٌ لا خط: يبقى فوق الكل كي يُقرأ.
          GL.map.addLayer(layer, layer.type === 'symbol' ? undefined : beforeId);
        });
      }
    }

    function clearRoutes() {
      var source = GL.map.getSource(ROUTE_SOURCE);
      if (source) source.setData(EMPTY_ROUTES);
    }

    /**
     * يحسب الالتفاف حول سجل، يرسمه، ويعيد كتلته للبطاقة.
     * الساعة ساعة بدء العمل لا ساعة القارئ: التأخير يُقاس حين يقع الإغلاق.
     */
    /** حدود آخر رسم — الإطار يجب أن يسع الالتفاف لا السجل وحده. */
    var lastRouteBounds = null;

    function detourFor(feature) {
      lastRouteBounds = null;
      if (!routing || !feature || !feature.geometry) return '';
      if (feature.geometry.type !== 'LineString') { clearRoutes(); return ''; }

      var hour = new Date(Number(feature.properties.start_ts) || Date.now()).getUTCHours();
      var result = MasarCityRouting.alternativesAround(routing, feature.geometry.coordinates, {
        hour: hour, count: 2,
      });

      var collection = MasarWorksMapSolution.routeCollection(result, function (states) {
        return MasarCityRouting.pathGeometry(routing, states);
      });
      var source = GL.map.getSource(ROUTE_SOURCE);
      if (source) source.setData(collection);
      if (collection.features.length) lastRouteBounds = Data.boundsOf(collection.features);

      return MasarWorksMapSolution.detourHtml(result);
    }

    // مربعات الطبقات تُخفي رموزاً على الخريطة؛ القائمة يجب أن تُخفي صفوفها معها
    // وإلا سردت ما لا يُرى. الحالة تُقرأ من المربعات نفسها لا تُخمَّن.
    var hiddenGroups = {};

    /**
     * حداثة البيانات معلنة: الساكن يحتاج أن يعرف متى قيلت له هذه المعلومة.
     * أحدث سجل *بدأ فعلاً* — لا أحدث سجل مطلقاً: المحفظة تحوي أعمالاً تبدأ في
     * المستقبل، وعرض تاريخها بوصفه «آخر تحديث» يقرأ كتاريخ مكذوب.
     */
    var now = Date.now();
    var latest = features.reduce(function (max, feature) {
      var at = Number(feature.properties.start_ts) || 0;
      return at <= now && at > max ? at : max;
    }, 0);
    if (latest) {
      updated.textContent = 'آخر تحديث: ' + new Intl.DateTimeFormat('ar-SA-u-nu-latn', {
        dateStyle: 'medium',
      }).format(new Date(latest));
    }

    function query() {
      return search ? search.value.trim() : '';
    }

    /** المطابقة بعد تطبيع الإملاء — المنطق في الوحدة كي يُختبر في Node. */
    function matching() {
      return Data.filterRecords(features, { query: query() });
    }

    /** ما تُظهره الخريطة فعلاً: البحث والفترة والطبقات الثلاثة معاً. */
    function visibleFeatures() {
      return Data.filterRecords(features, {
        query: query(),
        range: MasarWorksMapPanel.toEpochRange(select ? select.value : 'today', Date.now()),
        hiddenGroups: hiddenGroups,
      });
    }

    /** الموضع الذي رُسم عليه رمز السجل — لا مركز إطاره. */
    function anchorOf(feature) {
      if (feature.geometry.type === 'Point') return feature.geometry.coordinates;
      var anchor = Data.anchorOf(feature);
      return anchor ? anchor.geometry.coordinates : null;
    }

    /**
     * فتح سجل من القائمة: نفس البطاقة التي يفتحها النقر على الرمز، ونفس
     * الموضع. لوحة المفاتيح تصل إلى ما تصل إليه الفأرة بالضبط، لا إلى بديل.
     */
    var openPopup = null;
    function openRecord(feature) {
      if (!feature || !feature.geometry) return;
      var center = anchorOf(feature);
      if (!center) return;

      if (openPopup) openPopup.remove();
      openPopup = new maplibregl.Popup({ closeButton: true, maxWidth: '320px' })
        .setLngLat(center)
        .setHTML(MasarWorksMapInteractions.popupHtml(feature.properties, detourFor(feature)))
        .addTo(GL.map);
      // البطاقة تحجب نصف الخريطة، وإغلاقها أول ما يفعله من أراد رؤية المسار.
      // فمحو المسارات عند الإغلاق يمحو ما فُتحت البطاقة لأجله — تبقى حتى يُفتح
      // سجل آخر.

      /**
       * الحشو غير متماثل عمداً: البطاقة تُفتح تحت النقطة، فتركُ مسافة متساوية
       * حولها يضع السجل في وسط الإطار ويدفع نصف بطاقته خارجه. الحشو السفلي
       * بارتفاع بطاقة يرفع السجل إلى أعلى الإطار فتظهر البطاقة كاملة تحته.
       */
      var padding = { top: 50, bottom: 540, left: 170, right: 170 };
      // إن رُسم التفافٌ فالإطار يسعه: بديلٌ بطول عشرة كيلومترات خارج الشاشة
      // رسمٌ لم يُرَ، وقد حُسب كي يُرى.
      var bounds = lastRouteBounds || Data.boundsOf([feature]);
      if (!bounds) return;
      if (bounds[0][0] === bounds[1][0] && bounds[0][1] === bounds[1][1]) {
        GL.map.easeTo({ center: center, zoom: 14.5, padding: padding, duration: 600 });
      } else {
        GL.map.fitBounds(bounds, { padding: padding, maxZoom: 15, duration: 600 });
      }
    }

    function refresh() {
      var shown = visibleFeatures();
      var needle = query();

      stat.textContent = needle
        ? shown.length + ' نتيجة لـ «' + needle + '» ضمن الفترة المختارة'
        : shown.length + ' من ' + features.length + ' سجلاً ضمن الفترة المختارة';

      /**
       * الوفر يُحسب على المعروض لا على المحفظة.
       * -----------------------------------------------------------------------
       * رقمٌ ثابت فوق خريطة تتغيّر تحته يُقرأ لافتةً لا قياساً. وحين يرشّح
       * المراجع «هذا الأسبوع» أو يبحث باسم شارع فيتحرك الرقم معه، يفهم أنه
       * محسوبٌ على ما أمامه — وذلك وحده يجعله مصدَّقاً.
       */
      hero.innerHTML = MasarWorksMapSolution.barHtml(
        MasarWorksMapSolution.summarize(shown)
      );

      recordsCount.textContent = '(' + shown.length + ')';
      recordsBody.innerHTML = MasarWorksMapPanel.renderRecords(
        shown.map(function (feature) { return feature.properties; }), groups
      );

      // الربط بالمعرّف لا بترتيب الصفوف: تطابق موضعٍ بين مصفوفة ونصٍّ مولَّد
      // يصمت حين ينكسر — يفتح الصفُّ سجلَّ جاره ولا يشتكي أحد.
      var index = {};
      shown.forEach(function (feature) { index[feature.properties.id] = feature; });

      var buttons = recordsBody.querySelectorAll('button[data-id]');
      for (var i = 0; i < buttons.length; i += 1) {
        (function (button) {
          button.addEventListener('click', function () {
            openRecord(index[button.getAttribute('data-id')]);
          });
        })(buttons[i]);
      }
    }

    /**
     * البحث يرشّح الخريطة نفسها ويضم كل النتائج في الإطار — لا يطير إلى الأولى
     * فيخفي البقية، ولا يكتفي بتغيير رقم العدّاد.
     */
    function runSearch() {
      var found = matching();
      GL.api.setWorks({ type: 'FeatureCollection', features: found });
      refresh();
      if (!found.length || !query()) return;

      // المشي المركّب في الوحدة: `coordinates` مصفوفة مواضع في LineString
      // ومصفوفة مصفوفات في MultiLineString، والمشي المسطّح ينتج NaN صامتاً.
      var bounds = Data.boundsOf(found);
      if (bounds) {
        GL.map.fitBounds(bounds, { padding: 120, maxZoom: 14.5, duration: 600 });
      }
    }

    // مصدر واحد لكل تغيّر في اللوحة: الفترة ومربعات الطبقات كلاهما حدث change
    // يصعد إلى الحاوية. الاستماع على العنصر نفسه كان يفوّت المربعات.
    if (panelRoot) {
      panelRoot.addEventListener('change', function (event) {
        var target = event.target;
        var group = target && target.getAttribute ? target.getAttribute('data-group') : null;
        if (group) hiddenGroups[group] = !target.checked;
        refresh();
      });
    }
    if (search) search.addEventListener('input', runSearch);
    refresh();
  });

  GL.map.on('error', function (event) {
    if (event && event.error) console.error('[map]', event.error.message);
  });

  window.__masarWorksMap = GL;
})();
</script>

</body>
</html>
