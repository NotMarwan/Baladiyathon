<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أثر — مكتب المراجع</title>
<link rel="stylesheet" href="athar-tokens.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: var(--athar-font);
    background: var(--athar-canvas);
    color: var(--athar-ink);
  }
  .placeholder {
    max-width: 46ch;
    padding: var(--athar-space-8);
    background: var(--athar-surface);
    border: 1px solid var(--athar-line);
    border-radius: var(--athar-radius-lg);
    box-shadow: var(--athar-shadow);
    text-align: center;
    line-height: 1.7;
  }
  .placeholder h1 { font-size: 1.15rem; margin: 0 0 var(--athar-space-3); }
  .placeholder p { margin: 0 0 var(--athar-space-4); color: var(--athar-muted); font-size: 0.92rem; }
  .placeholder a {
    display: inline-block;
    padding: var(--athar-space-2) var(--athar-space-6);
    background: var(--athar-primary);
    color: #fff;
    text-decoration: none;
    border-radius: var(--athar-radius-sm);
    font-weight: 700;
    transition: background var(--athar-t-control);
  }
  .placeholder a:hover { background: var(--athar-primary-hover); }
  .placeholder a:focus-visible { outline: 2px solid var(--athar-primary); outline-offset: 2px; }
</style>
</head>
<body>

<main class="placeholder">
  <h1>مكتب المراجع قيد التركيب</h1>
  <p>
    صندوق الأعمال والخريطة وملف القرار على شاشة واحدة.
    حتى يكتمل، شاشة القرار تعرض المسار نفسه لتصريح واحد.
  </p>
  <a href="athar-decision.html">افتح شاشة القرار</a>
</main>

<script src="athar-nav.js"></script>
</body>
</html>
