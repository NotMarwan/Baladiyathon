<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أثر — الخريطة</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="athar-worksmap-page.css">
</head>
<body>

<header class="wm-bar">
  <h1>أعمال الطرق في الرياض — الخريطة العامة للسكان</h1>
  <span class="wm-badge">بيانات توضيحية للعرض</span>

  <label class="wm-search">
    <span class="visually-hidden">ابحث باسم الشارع</span>
    <input id="wmSearch" type="search" placeholder="ابحث باسم الشارع…" autocomplete="off">
  </label>

  <span class="wm-bar-spacer"></span>
  <span class="wm-updated" id="wmUpdated">آخر تحديث: —</span>
  <span class="wm-stat" id="wmStat" role="status">جارٍ التحميل…</span>
</header>

<main>
  <div id="map" role="application" aria-label="خريطة أعمال الطرق والإغلاقات والحوادث"></div>
  <aside id="control-panel" aria-label="عناصر التحكم بالخريطة"></aside>

  <section class="wm-legend" aria-label="دليل الخريطة">
    <h2>الدليل</h2>
    <div class="wm-legend-row" style="color:#f0a020"><span class="wm-legend-line"></span><span>أعمال طرق</span></div>
    <div class="wm-legend-row" style="color:#c92a2a"><span class="wm-legend-line"></span><span>إغلاق</span></div>
    <div class="wm-legend-row" style="color:#f76707"><span class="wm-legend-line"></span><span>حادث</span></div>
    <div class="wm-legend-row" style="color:#1c7ed6"><span class="wm-legend-line"></span><span>تحويلة</span></div>
  </section>
</main>

<script src="athar-nav.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="data/riyadh-roads.geojson.js"></script>
<script src="data/riyadh-base.geojson.js"></script>
<script src="data/city-portfolio.geojson.js"></script>
<script src="athar-worksmap-style.js"></script>
<script src="athar-worksmap-layers.js"></script>
<script src="athar-worksmap-data.js"></script>
<script src="athar-worksmap.js"></script>
<script src="athar-roads-lazy.js"></script>
<script src="athar-worksmap-panel.js"></script>
<script src="athar-worksmap-interactions.js"></script>
<script>
(function () {
  'use strict';

  // صفحة الخريطة مستقلة عن النموذج: تبني الخريطة مباشرة بلا عقد الممر.
  // البيانات محلية بالكامل (window globals) فتعمل من القرص كما تعمل من الخادم.
  var container = document.getElementById('map');
  var stat = document.getElementById('wmStat');

  function fail(message) {
    stat.textContent = 'تعذّر العرض';
    var box = document.createElement('p');
    box.className = 'wm-error';
    box.setAttribute('role', 'alert');
    box.textContent = message;
    document.querySelector('main').appendChild(box);
  }

  if (typeof maplibregl === 'undefined' || typeof AtharWorksMap === 'undefined') {
    fail('تعذّر تحميل محرك الخريطة.');
    return;
  }

  var GL = AtharWorksMap.init(container, window.RIYADH_ROADS, {
    baseGeoJSON: window.RIYADH_BASE,
    center: [46.6872, 24.6902],
    zoom: 11.7,
  });

  GL.map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
  GL.map.addControl(new maplibregl.ScaleControl({ maxWidth: 110, unit: 'metric' }), 'bottom-left');

  GL.api.onReady(function () {
    // الحلقة الثانية من الشبكة تلتحق عند أول خمول — الخريطة صالحة قبلها.
    if (typeof AtharRoadsLazy !== 'undefined') AtharRoadsLazy.attach(GL.api);
    var works = window.ATHAR_CITY_PORTFOLIO || { type: 'FeatureCollection', features: [] };
    GL.api.setWorks(works);

    AtharWorksMapInteractions.install(GL.map, maplibregl, 'works');
    AtharWorksMapPanel.mount(document.getElementById('control-panel'), GL.api, Date.now());

    var features = GL.api.getData().works.features;
    var select = document.getElementById('athar-date-preset');
    var search = document.getElementById('wmSearch');
    var updated = document.getElementById('wmUpdated');

    /**
     * حداثة البيانات معلنة: الساكن يحتاج أن يعرف متى قيلت له هذه المعلومة.
     * أحدث سجل *بدأ فعلاً* — لا أحدث سجل مطلقاً: المحفظة تحوي أعمالاً تبدأ في
     * المستقبل، وعرض تاريخها بوصفه «آخر تحديث» يقرأ كتاريخ مكذوب.
     */
    var now = Date.now();
    var latest = features.reduce(function (max, feature) {
      var at = Number(feature.properties.start_ts) || 0;
      return at <= now && at > max ? at : max;
    }, 0);
    if (latest) {
      updated.textContent = 'آخر تحديث: ' + new Intl.DateTimeFormat('ar-SA-u-nu-latn', {
        dateStyle: 'medium',
      }).format(new Date(latest));
    }

    function matching() {
      var needle = search ? search.value.trim() : '';
      if (!needle) return features;
      return features.filter(function (feature) {
        var p = feature.properties;
        return String(p.street || '').indexOf(needle) !== -1
          || String(p.title || '').indexOf(needle) !== -1
          || String(p.promoter || '').indexOf(needle) !== -1
          || String(p.id || '').indexOf(needle) !== -1;
      });
    }

    /** العدّاد يذكر ما تُظهره الخريطة فعلاً: البحث والفترة معاً، لا الفترة وحدها. */
    function refreshStat() {
      var range = AtharWorksMapPanel.toEpochRange(select ? select.value : 'today', Date.now());
      var found = matching();
      var visible = range
        ? found.filter(function (f) {
            var p = f.properties;
            return p.start_ts < range.to && p.end_ts > range.from;
          }).length
        : found.length;

      var needle = search ? search.value.trim() : '';
      stat.textContent = needle
        ? visible + ' نتيجة لـ «' + needle + '» ضمن الفترة المختارة'
        : visible + ' من ' + features.length + ' سجلاً ضمن الفترة المختارة';
    }

    /**
     * البحث يرشّح الخريطة نفسها ويضم كل النتائج في الإطار — لا يطير إلى الأولى
     * فيخفي البقية، ولا يكتفي بتغيير رقم العدّاد.
     */
    function runSearch() {
      var found = matching();
      GL.api.setWorks({ type: 'FeatureCollection', features: found });
      refreshStat();
      if (!found.length || !search.value.trim()) return;

      var west = Infinity, south = Infinity, east = -Infinity, north = -Infinity;
      found.forEach(function (feature) {
        var coords = feature.geometry.type === 'Point'
          ? [feature.geometry.coordinates]
          : feature.geometry.coordinates;
        coords.forEach(function (point) {
          west = Math.min(west, point[0]);
          east = Math.max(east, point[0]);
          south = Math.min(south, point[1]);
          north = Math.max(north, point[1]);
        });
      });

      GL.map.fitBounds([[west, south], [east, north]], {
        padding: 120, maxZoom: 14.5, duration: 600,
      });
    }

    if (select) select.addEventListener('change', refreshStat);
    if (search) search.addEventListener('input', runSearch);
    refreshStat();
  });

  GL.map.on('error', function (event) {
    if (event && event.error) console.error('[map]', event.error.message);
  });

  window.__atharWorksMap = GL;
})();
</script>

</body>
</html>
